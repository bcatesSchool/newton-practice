on:
  push:
    branches:
    - main

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Install dependencies
    - name: Set up Python 
      uses: actions/setup-python@v7
      with:
        python-version: 3.12

    - name: Install newton
      run: |                          # Assume you are in the directory of the repository.
        pip install --user .
        pip install pytest

    - name: Run tests
      run: |
        cd newton
        pytest
